services:
  pinterest-mcp:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      MCP_AUTH_SECRET: ${MCP_AUTH_SECRET:?Set a random secret of at least 32 characters}
      PINTEREST_APP_ID: ${PINTEREST_APP_ID:-}
      PINTEREST_APP_SECRET: ${PINTEREST_APP_SECRET:-}
      PINTEREST_REDIRECT_URI: ${PINTEREST_REDIRECT_URI:-}
      PINTEREST_SANDBOX: ${PINTEREST_SANDBOX:-0}
      PINTEREST_MAX_RETRIES: ${PINTEREST_MAX_RETRIES:-3}
    volumes:
      - publisher-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  publisher-data:
